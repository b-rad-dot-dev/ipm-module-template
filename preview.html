<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Dashboard Preview</title>
    <style>
        :root {
            --background: #1a1a1a;
            --border: 1px solid #2a2a2a;

            --component-background: #2a2a2a;
            --component-border: 1px solid #3a3a3a;
            --component-padding: 6px 8px;
            --component-border-radius: 3px;

            --font-color-default: #e0e0e0;
            --font-color-secondary: #888888;
            --font-color-primary: #4a90e2;
            --font-size: 12px;

            /* For Testing */
            --grid-rows: 1;
            --grid-columns: 2;
            --x: 2;
            --y: 1;
            --width: 1;
            --height: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Grid container */
        #grid-container {
            width: 100%;
            height: 100%;
        }

        #grid-container {
            display: grid;
            gap: 4px;
            padding: 4px;
            position: relative;

            /* Scale up content for small high-DPI displays */
            transform: scale(2.0);
            transform-origin: top left;
            width: 50%; /* Compensate for 2x scale */
            height: 50%; /* Compensate for 2x scale */
        }

        .module-wrapper {
            background: var(--background);
            border: var(--border);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .module-content {
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 8px;
        }

        /* Scrollbar styling for minimal look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
<div id="taskbar"></div>
<button id="taskbar-toggle" class="taskbar-toggle" style="display: none;">☰</button>
<div id="grid-container" style="grid-template-columns: repeat(var(--grid-columns), 1fr); grid-template-rows: repeat(var(--grid-rows), 1fr);">
    <div class="module-wrapper" style="grid-area: var(--y) / var(--x) / span var(--height) / span var(--width);">
        <div class="module-content" id="wrapper">

        </div>
    </div>
</div>

<script type="module">
    import Module from "./index.js";

    const wrapper = document.getElementById("wrapper");

    new Module(wrapper, {
        exampleConfig: "Hello Dev"
    });
</script>
</body>
</html>
